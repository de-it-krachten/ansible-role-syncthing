---

- name: Converge
  hosts: all
  become: "yes"
  vars:
    syncthing_user: syncthing
    syncthing_folders: "[{'id': 'f2c6b06bf7d0bc8f6471e3c97933dd421cf9e864', 'label': 'test01', 'path': '{{ syncthing_home }}/test01'}, {'id': '534e995fef5b8e236deffa878228172dad0578e1', 'label': 'test02', 'path': '{{ syncthing_home }}/test02', 'encryption_password': 'BNaFIsMKcpD+yhzv+zNLP4b8VG5CyWnKPSXchLhBNOs='}]"
  tasks:
    - name: Include role 'ansible-role-syncthing'
      ansible.builtin.include_role:
        name: ansible-role-syncthing
    - name: Create random files
      ansible.builtin.shell:
        cmd: |
          echo "TEST" > {{ item.path }}/TEST.txt
          dd if=/dev/urandom of={{ item.path }}/testfile1 bs=1M count=1
          dd if=/dev/urandom of={{ item.path }}/testfile2 bs=1M count=1
          dd if=/dev/urandom of={{ item.path }}/testfile3 bs=1M count=1
          dd if=/dev/urandom of={{ item.path }}/testfile4 bs=1M count=1
      changed_when: true
      loop: "{{ syncthing_folders }}"
      loop_control:
        label: "{{ item.label }}"
      when: inventory_hostname == groups['syncthing_clients'][0]
      tags: molecule-idempotence-notest

